[project]
name = "knowledge-hub-backend"
version = "1.0.0"
description = "企业智能知识库系统 - FastAPI 后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "pydantic>=2.8",
    "pydantic-settings==2.3.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "pymongo>=4.17.0",
    "motor>=3.7.1",
    "greenlet>=3.5.5",
    "boto3>=1.43.81",
    "mammoth>=1.12.1",
    "markdownify>=1.2.3",
    "pymupdf>=1.28.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "aio-pika>=9.4",
    "langchain-text-splitters>=1.1.2",
    "langchain-openai>=1.6.0",
    "elasticsearch>=8.17",
    "aiohttp>=3.14.3",
    "neo4j>=6.3.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "email-validator>=2.3.0",
    "redis>=8.1.0",
    "aiosmtplib>=5.1.2",
    "langchain>=1.4.0",
    "langchain-deepseek>=1.1.0",
    "mem0ai>=2.0.20",
    "typesafe-sdk>=0.7.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 让 `pytest`（控制台脚本）也能 import app.*：否则只有 `python -m pytest` 会把 cwd 入 sys.path
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# 明确的规则集（ruff 默认集会随版本变化，CI 需要可复现的判定）
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501",  # 行长度：大量中文注释 / 长字符串
    "E712",  # SQLAlchemy 的 col == True/False 是 SQL 表达式，非布尔比较
    "E402",  # scripts/* 里 sys.path.insert 之后的 import
]

[tool.ruff.lint.per-file-ignores]
# __init__.py 里 import 模型是为让 ORM 注册到 Base.metadata，属副作用导入
"app/models/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

# ⚠️ mem0ai 没带 py.typed，但 mypy 仍会**跟随它的 import 图**：实测日志显示会去解析
# qdrant-client / dnspython / posthog / urllib3 / pydantic.v1 等一大堆第三方包，
# 在本机（16G 内存被 Docker 占满、free 仅百余 MB）直接 OOM 被杀，exit 137。
# 显式跳过该包的类型跟随；mem0 对象按 Any 处理，业务侧用法已在
# services/chat_long_memory.py 里按 mem0ai 2.0.20 源码逐条核对，不依赖 mypy 兜底。
[[tool.mypy.overrides]]
module = ["mem0", "mem0.*"]
follow_imports = "skip"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
