[project]
name = "knowledge-hub-backend"
version = "1.0.0"
description = "企业智能知识库系统 - FastAPI 后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "pydantic-settings==2.3.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "pymongo>=4.17.0",
    "motor>=3.7.1",
    "greenlet>=3.5.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
