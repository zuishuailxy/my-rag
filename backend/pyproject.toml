[project]
name = "knowledge-hub-backend"
version = "1.0.0"
description = "企业智能知识库系统 - FastAPI 后端"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "pydantic>=2.8",
    "pydantic-settings==2.3.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.31.0",
    "pgvector>=0.5.0",
    "pymongo>=4.17.0",
    "motor>=3.7.1",
    "greenlet>=3.5.5",
    "boto3>=1.43.81",
    "mammoth>=1.12.1",
    "markdownify>=1.2.3",
    "pymupdf>=1.28.2",
    "python-pptx>=1.0.2",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "httpx>=0.28.1",
    "aio-pika>=9.4",
    "langchain-text-splitters>=1.1.2",
    "langchain-openai>=1.6.0",
    "elasticsearch>=8.17",
    "aiohttp>=3.14.3",
    "neo4j>=6.3.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "email-validator>=2.3.0",
    "redis>=8.1.0",
    "aiosmtplib>=5.1.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
]
